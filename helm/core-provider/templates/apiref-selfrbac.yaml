{{- if .Values.apiRefRBAC.enabled }}
# apiRef status-projection self-RBAC. When a CompositionDefinition declares spec.apiRef, core-provider
# calls snowplow's /rbac under its OWN authn-issued identity (organization = apiRefRBAC.group) to
# enumerate the RESTAction's read-set. That call READS the RESTAction object, so the group needs a
# `get restactions` grant — authn issues the identity but never authors RBAC. Without this the
# reconcile 403s ("cannot get restactions.templates.krateo.io"). The per-composition CDC group gets
# its own read-set + restaction grant auto-generated by core-provider (restactionrbac); this template
# only covers core-provider's static self identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "core-provider.fullname" . }}-apiref-read-restactions
  labels:
    {{- include "core-provider.labels" . | nindent 4 }}
rules:
- apiGroups:
  - templates.krateo.io
  resources:
  - restactions
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "core-provider.fullname" . }}-apiref-read-restactions
  labels:
    {{- include "core-provider.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "core-provider.fullname" . }}-apiref-read-restactions
subjects:
- kind: Group
  name: {{ .Values.apiRefRBAC.group }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
