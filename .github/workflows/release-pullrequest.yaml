name: release-pullrequest

on:
  pull_request:
    branches:
      - main

# core-provider is a Go MONOREPO: three independent modules each with its own go.mod +
# Dockerfile (go/core-provider, go/composition-dynamic-controller, go/chart-inspector). The
# previous inline jobs ran from the repo ROOT and failed on every PR ("open Dockerfile: no
# such file or directory" / "go.mod not found"). This uses the same folded-aware reusables as
# release-tag.yaml so folded and monorepo repos share one CI shape.
jobs:
  build:
    # Validate all three images build multi-platform, WITHOUT pushing. Same modules list as
    # release-tag.yaml; chart-inspector builds from the shared `go` context (its Dockerfile does
    # `COPY . .` then `WORKDIR /src/chart-inspector`), so its dockerfile path is explicit.
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    with:
      modules: '[{"mod":"core-provider","context":"go/core-provider"},{"mod":"composition-dynamic-controller","context":"go/composition-dynamic-controller"},{"mod":"chart-inspector","context":"go","dockerfile":"go/chart-inspector/Dockerfile"}]'
      push: false
    secrets: inherit

  # One reusable invocation per module (each has its own go.mod). Explicit jobs rather than a
  # matrix: reusable-workflow inputs are strictly typed, and a matrix value reaches `with:` as a
  # templated string, which a typed `boolean` input (crd_drift) rejects at startup. Literal
  # values sidestep that. CRD-drift (make generate + git diff crds/) runs only for core-provider,
  # the sole module with committed crds/.
  test-core-provider:
    name: go-checks (core-provider)
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/core-provider
      crd_drift: true
      test_args: "-race -tags=unit,integration -p 1 -timeout 30m -coverprofile=coverage.txt -covermode=atomic ./... -coverpkg=./..."
    secrets: inherit

  test-composition-dynamic-controller:
    name: go-checks (composition-dynamic-controller)
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/composition-dynamic-controller
      test_args: "-race -coverprofile=coverage.txt -covermode=atomic ./..."
    secrets: inherit

  test-chart-inspector:
    name: go-checks (chart-inspector)
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/chart-inspector
      test_args: "-race -coverprofile=coverage.txt -covermode=atomic ./..."
    secrets: inherit
